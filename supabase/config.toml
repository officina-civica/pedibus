# Configurazione Supabase CLI per il progetto Pedibus.
# Generata a mano, compatta: le chiavi assenti prendono i default della CLI.
project_id = "pedibus"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Accesso (deciso il 27/10): primo accesso con codice via SMS, poi passkey come metodo
# principale; il codice SMS resta di riserva. Admin: in più un'app di autenticazione (TOTP).
[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Pedibus: il tuo codice è {{ .Code }}. Vale 5 minuti."
max_frequency = "60s"

[auth.sms.twilio]
enabled = true
account_sid = "env(SUPABASE_AUTH_SMS_TWILIO_ACCOUNT_SID)"
message_service_sid = "env(SUPABASE_AUTH_SMS_TWILIO_MESSAGE_SERVICE_SID)"
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

[auth.rate_limit]
# Ogni OTP è un SMS pagato: pochi all'ora bastano a 40 famiglie e 30 volontari.
sms_sent = 30
token_verifications = 30

# Passkey (WebAuthn): in Supabase è ancora sperimentale, l'API può cambiare.
# ATTENZIONE: rp_id è il dominio definitivo dell'app. Cambiarlo dopo invalida tutte le
# passkey registrate: va deciso prima del primo utente vero.
[auth.passkey]
enabled = true

[auth.webauthn]
rp_display_name = "Pedibus Vedano"
rp_id = "localhost"
rp_origins = ["http://localhost:3000"]

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.invia-avvisi]
# Chiamata da pg_net/pg_cron con il segreto condiviso, non con un JWT utente.
verify_jwt = false
