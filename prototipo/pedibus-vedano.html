const STATUS_LABEL = { ok:'Parte regolarmente', cancelled:'Annullata: sotto soglia', reactivated:'Riattivata: soglia raggiunta', cancelled_final:'Annullata per domani', cancelled_vol:'Annullata: volontari insufficienti' };
const lineRuns = line => ['ok','reactivated'].includes(S.lineStatus[line]);

/* ---------- regole ---------- */
function evalThreshold(line, reason){
  const Ln = L(line), n = presentOf(line).length, st = S.lineStatus[line];
  if (n < Ln.threshold && ['ok','reactivated'].includes(st) && S.phase >= 1 && S.phase < 3){
    S.lineStatus[line] = 'cancelled';
    notifyParents(line, { kind:'warn', sms:true, title:`${Ln.name} annullata per domani`, body:`Solo ${n} bambini presenti, minimo ${Ln.threshold}. Si riattiva se entro le 21:00 si raggiunge la soglia.` });
    notifyVols(line, { kind:'warn', sms:true, title:`${Ln.name} annullata per domani`, body:`${n} bambini presenti su un minimo di ${Ln.threshold}. Il turno è sospeso, salvo riattivazione entro le 21:00.` });
    notifyAdmin({ kind:'warn', title:`${Ln.name} sotto soglia`, body:`${n} presenti alle ${reason === 'close' ? '18:00' : now().slice(4)}, minimo ${Ln.threshold}. Annullata, riattivabile fino alle 21:00.` });
  } else if (n >= Ln.threshold && st === 'cancelled' && S.phase < 3){
    S.lineStatus[line] = 'reactivated';
    notifyParents(line, { kind:'ok', sms:true, title:`${Ln.name} riattivata`, body:`Raggiunti ${n} bambini: il pedibus di domani parte alle ${Ln.start}.` });
    notifyVols(line, { kind:'ok', sms:true, title:`${Ln.name} riattivata`, body:`${n} bambini presenti: il turno di domani è confermato.` });
    notifyAdmin({ kind:'ok', title:`${Ln.name} riattivata`, body:`${n} presenti alle ${now().slice(4)}: soglia raggiunta.` });
  }
}
/* Cambia una presenza e applica le regole; ritorna il messaggio per il toast (null se nulla è cambiato). */
function applyPresence(id, val){
  const k = S.K[id]; if (k.presence === val) return null;
  k.presence = val;
  if (S.phase < 1) return val === 'absent' ? 'Assenza segnalata.' : 'Assenza annullata.';
  k.late = true;
  const Ln = L(k.line), what = val === 'absent' ? 'assente domani' : 'assenza annullata, domani c\'è';
  notifyVols(k.line, { kind:'warn', title:`${k.name}: ${what} (modifica tardiva)`, body:`Segnato da Giulia Bianchi alle ${now().slice(4)} · ${Ln.name}, fermata ${k.stop + 1}.` });
  notifyAdmin({ kind:'info', title:`Modifica tardiva: ${k.name}, ${what}`, body:`${Ln.name}, fermata ${k.stop + 1} · segnato da Giulia Bianchi alle ${now().slice(4)}.` });
  if (['cancelled_final','cancelled_vol'].includes(S.lineStatus[k.line])) return 'Registrato. La linea però è annullata per domani.';
  evalThreshold(k.line, 'late');
  return 'Modifica tardiva: i volontari di turno sono avvisati.';
}
function setPresence(id, val){ const msg = applyPresence(id, val); if (msg) toast(msg); }
function escalate(line, who){
  const Ln = L(line), s = S.shifts[line];
  const missing = s.vols.filter(v => S.V[v].out).map(v => S.V[v].name);
  const backups = s.backups.filter(v => !S.V[v].covering).map(v => S.V[v].name);
  S.esc[line] = { step: shiftCount(line) >= Ln.minVol ? 'covered' : 'backup', since: now(), missing };
  notifyVols(line, { kind:'warn', sms:true, title:`${who} non può venire`, body:`${Ln.name}, turno delle ${Ln.start}: ${shiftCount(line)} ${shiftCount(line) === 1 ? 'volontario' : 'volontari'} su ${Ln.minVol}. Avvisati i backup${backups.length ? ' (' + backups.join(', ') + ')' : ''}; dopo 10 minuti l'avviso va a tutti.` });
  notifyAdmin({ kind:'warn', sms:true, title:`${Ln.name}: ${who} non può venire`, body:`Turno delle ${Ln.start} a ${shiftCount(line)} su ${Ln.minVol}. Escalation partita alle ${now().slice(4)}.` });
}
function deliverLine(line, at){
  const Ln = L(line), onBoard = presentOf(line).filter(k => line !== 'verde' || S.appello.checked[k.id]);

}

}
function onEnter(p){
  if (p === 1){
    Object.keys(LINES).forEach(l => evalThreshold(l, 'close'));
    const mine = giuliaKids().filter(k => k.presence === 'present' && lineRuns(k.line));
    if (mine.length) push('parent', { kind:'info', title:`Domani ${mine.map(k => first(k.name)).join(' e ')} ${mine.length > 1 ? 'sono attesi' : (mine[0].f ? 'è attesa' : 'è atteso')} alla fermata`, body:'Assenze chiuse alle 18:00. Puoi ancora segnalarne una: sarà tardiva e i volontari avvisati.' });
    notifyAdmin({ kind:'info', title:'Assenze chiuse alle 18:00', body:`Presenti domani: Verde ${presentOf('verde').length}, Blu ${presentOf('blu').length}. Modifiche da ora in poi sono tardive.` });
  }
  if (p === 2) applyPresence('sofia', 'present'); /* Giulia annulla l'assenza di Sofia: modifica tardiva sulla Blu, visibile nella sua schermata */
  if (p === 3){
    Object.keys(LINES).forEach(l => { if (S.lineStatus[l] === 'cancelled'){ S.lineStatus[l] = 'cancelled_final'; notifyParents(l, { kind:'warn', sms:true, title:`${L(l).name}: annullamento definitivo`, body:'Soglia non raggiunta entro le 21:00. Domani il pedibus non parte.' }); notifyVols(l, { kind:'warn', sms:true, title:`${L(l).name}: turno di domani annullato`, body:'Soglia non raggiunta entro le 21:00.' }); } });
    notifyAdmin({ kind:'info', title:'Soglie chiuse alle 21:00', body:`Verde: ${presentOf('verde').length} presenti, ${STATUS_LABEL[S.lineStatus.verde].toLowerCase()}. Blu: ${presentOf('blu').length} presenti, ${STATUS_LABEL[S.lineStatus.blu].toLowerCase()}.` });
  }
  if (p === 4){ S.V.paolo.out = true; escalate('verde', 'Paolo Verdi'); }
  if (p === 5){
    S.V.anna.covering = true;
    const ok = shiftCount('verde') >= L('verde').minVol;
    S.esc.verde = { step: ok ? 'covered' : 'backup', since: now(), missing: S.esc.verde ? S.esc.verde.missing : [] };
    notifyVols('verde', { kind: ok ? 'ok' : 'warn', title:'Anna Ferrari copre il turno', body: ok ? `Linea Verde al completo: ${shiftCount('verde')} su ${L('verde').minVol}, kit presente.` : `Linea Verde ancora a ${shiftCount('verde')} su ${L('verde').minVol}: l'avviso va a tutti i volontari.` });
    notifyAdmin({ kind: ok ? 'ok' : 'warn', title:'Anna Ferrari copre la Verde', body: ok ? 'Turno completo, kit presente.' : `Turno ancora sotto il minimo (${shiftCount('verde')} su ${L('verde').minVol}).` });
  }
  if (p === 6){
    Object.keys(LINES).forEach(l => {
      if (!lineRuns(l)) return;
      if (shiftCount(l) < L(l).minVol){
        S.lineStatus[l] = 'cancelled_vol'; if (S.esc[l]) S.esc[l].step = 'cancelled';
        notifyParents(l, { kind:'warn', sms:true, title:`${L(l).name} annullata stamattina`, body:`Volontari insufficienti (${shiftCount(l)} su ${L(l).minVol}) un'ora prima della partenza. Accompagnate i bambini voi.` });
        notifyVols(l, { kind:'warn', sms:true, title:`${L(l).name} annullata`, body:'Turno sotto il minimo un\'ora prima della partenza. Famiglie avvisate via push e SMS.' });
        notifyAdmin({ kind:'warn', sms:true, title:`${L(l).name} annullata: volontari insufficienti`, body:`${shiftCount(l)} su ${L(l).minVol}. Famiglie avvisate alle 6:30.` });
      }
    });
    if (lineRuns('verde')){ S.appello.open = true; S.appello.stop = 0; notifyVols('verde', { kind:'info', title:'Si parte: appello al capolinea', body:`Linea Verde, piazza Repubblica · ${presentOf('verde').length} bambini attesi oggi · ${shiftNames('verde')}.` }); }
  }
  if (p === 7){
    if (lineRuns('blu')) deliverLine('blu', '8:01');
    if (S.appello.open && !S.appello.delivered){
      presentOf('verde').forEach(k => { if (!k.missed) S.appello.checked[k.id] = true; });
      S.appello.stop = L('verde').stops.length - 1; S.appello.delivered = true; S.appello.deliveredAt = '8:02';
      deliverLine('verde', '8:02');
    }
  }
}
/* Porta la demo al passo k e apre la schermata in cui quel passo succede.
   In avanti conserva quello che l'utente ha fatto; all'indietro riparte da capo e rigioca fino a k. */
function stepTo(k){
  k = Math.max(0, Math.min(+k, PHASES.length - 1));
  if (k < S.phase) S = initState();
  while (S.phase < k){ S.phase++; onEnter(S.phase); }
  const [persona, tab] = PHASES[k].scene;
  Object.assign(S, { loggedIn:true, persona, tab, showBackup:false, sheet:false, toast:null });
}

  },
  backup(){ S.showBackup = !S.showBackup; },
  apcheck(id){ S.appello.checked[id] = !S.appello.checked[id]; },
  apadd(){ S.appello.adding = !S.appello.adding; },
  apaddkid(id){ const k = S.K[id]; k.presence = 'present'; k.added = true; k.stop = S.appello.stop; S.appello.checked[id] = true; S.appello.adding = false; toast(`${first(k.name)} aggiunto: presente con nota.`); },
  apnext(){
    const idx = S.appello.stop, st = L('verde').stops;
    presentOf('verde').filter(k => k.stop === idx && !S.appello.checked[k.id]).forEach(k => {
      k.missed = true;
      if (k.parent === 'giulia') push('parent', { kind:'warn', sms:true, title:`${first(k.name)} non era alla fermata`, body:`${st[idx].name} alle ${st[idx].time}: era atteso ma non c'era. Il pedibus è ripartito.` });
      notifyAdmin({ kind:'warn', title:`${k.name} non trovato alla fermata ${idx + 1}`, body:`Linea Verde, ${st[idx].name} alle ${st[idx].time}. Genitore avvisato.` });
    });
    if (idx < st.length - 1) S.appello.stop = idx + 1;
  },
  apdeliver(){ S.appello.delivered = true; S.appello.deliveredAt = S.phase >= 7 ? '8:02' : '7:58'; deliverLine('verde', S.appello.deliveredAt); toast('Consegna confermata: genitori avvisati.'); },
  avail(d){ const a = S.V.marta.avail, i = a.indexOf(+d); if (i >= 0) a.splice(i, 1); else a.push(+d); },
  approve(id){ const r = S.regs.find(r => r.id === id); r.status = 'approved'; toast(`${r.name}: iscrizione approvata, notifica inviata.`); },
  reject(id){ const r = S.regs.find(r => r.id === id); r.status = 'rejected'; toast(`${r.name}: iscrizione rifiutata.`); },
  bozza(){ S.bozza = 'draft'; S.bozzaExc = Object.keys(S.V.marta.exc).length; },
  sendbozza(){ S.bozza = 'sent'; toast('Bozza inviata ai 30 volontari. Silenzio-assenso il 31 ottobre.'); },
  regen(){ S.bozzaStale = false; S.bozza = 'draft'; S.bozzaExc = Object.keys(S.V.marta.exc).length; toast('Bozza rigenerata con le nuove disponibilità: da rivedere e reinviare.'); },
  exc(d){
    d = +d; const m = S.V.marta, dflt = m.avail.includes((d + 5) % 7);
    if (m.exc[d]) delete m.exc[d]; else m.exc[d] = dflt ? 'out' : 'in';
    if (S.bozza){ /* la bozza esiste già: l'eccezione non la cambia da sola, l'amministratore deve rivederla */
      S.bozzaStale = true;
      notifyAdmin({ kind:'warn', title:'Marta Rossi: disponibilità di novembre cambiata dopo la bozza', body:`${!m.exc[d] ? `Tolta l'eccezione del ${d} nov` : `${d} nov: ${m.exc[d] === 'out' ? 'non c\'è' : 'c\'è in più'}`}. Rigenera la bozza o correggi a mano.` });
      toast('Segnato. La bozza è già stata fatta: l\'amministratore è avvisato.');
    } else toast(!m.exc[d] ? 'Eccezione tolta.' : m.exc[d] === 'out' ? `${d} novembre: non ci sei. La bozza ne terrà conto.` : `${d} novembre: ci sei in più. La bozza ne terrà conto.`);
  },
  step(k){ stepTo(+k); },
  next(){ stepTo(S.phase + 1); },
  reset(){ S = initState(); },
  sheet(){ S.sheet = !S.sheet; },
  lineopen(id){ S.lineOpen = S.lineOpen === id ? null : id; },
  regdone(){ S.screen = 'accesso'; S.regDone = null; },
  mode(m){ MODE = m; S.sheet = false; if (m === 'mappa') GAL.filter = 'all'; window.scrollTo(0, 0); },
  galfilter(id){ GAL.filter = id; window.scrollTo(0, 0); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;

document.addEventListener('submit', e => {
  if (e.target.id !== 'regform') return;

  const fd = new FormData(e.target);

  S.regs.unshift({ id:'r' + Date.now(), name, kind:'genitore', detail:`1 bambino · ${line}`, when:'adesso', status:'pending' });

  render();
});

    <div class="card"><div class="hstack">${lineDot('verde')}<span class="title">${Ln.name}</span></div><p class="small">L'appello si apre alle ${Ln.start} al capolinea (${st[0].name}). Attesi ${presentOf('verde').length} bambini su ${kidsOf('verde').length} iscritti, lungo ${st.length - 1} fermate.</p>

    ${presentOf('verde').some(k => k.missed) ? `<div class="alert a-warn">${ic('warn', 16)}<div class="body"><b>Non trovati alla fermata</b><span>${presentOf('verde').filter(k => k.missed).map(k => k.name).join(', ')}. Genitori avvisati.</span></div></div>` : ''}
    <p class="small" style="text-align:center">Grazie Marta. Il prossimo turno è venerdì sulla Linea Blu.</p></div>`;
  const idx = A.stop, atSchool = idx === st.length - 1;
  const expected = presentOf('verde').filter(k => k.stop === idx);

  const addable = kidsOf('verde').filter(k => k.presence !== 'present');
  return `<div class="stack" style="gap:12px">
    <div class="between"><div class="hstack">${lineDot('verde')}<span class="title" style="font-size:17px">${Ln.name}</span></div><button class="btn btn-outline iconbtn" aria-label="Contatti d'emergenza">${ic('phone', 20)}</button></div>
    <div class="stack-s">
      <div class="between"><h2>${atSchool ? 'Arrivo' : `Fermata ${idx + 1} di ${st.length - 1}`}</h2><span class="small mono">${atSchool ? `${onBoard} a bordo` : `${expected.filter(k => A.checked[k.id]).length} di ${expected.length} presenti`}</span></div>
      <div class="progress" style="grid-template-columns:repeat(${st.length},minmax(0,1fr))">${st.map((s, i) => `<span class="${i < idx ? 'done' : i === idx ? 'cur' : ''}"></span>`).join('')}</div>
      <div class="hstack">${ic(atSchool ? 'school' : 'pin', 18)}<span style="font-size:18px;font-weight:700">${st[idx].name}</span><span class="meta mono">${st[idx].time}</span></div>
    </div>
    ${atSchool ? `<div class="rows">${presentOf('verde').filter(k => A.checked[k.id]).map(k => `<div class="row" style="min-height:52px"><span class="av av-s">${initials(k.name)}</span><span class="grow" style="font-weight:600">${k.name}</span><span class="meta">${k.cls}</span></div>`).join('')}</div>`
    : expected.length ? `<div class="rows">${expected.map(k => `<button class="row row-btn" data-act="apcheck" data-a="${k.id}" style="${A.checked[k.id] ? '' : 'background:var(--muted-bg)'}"><span class="av">${initials(k.name)}</span><span class="grow"><span class="title" style="display:block;font-size:17px">${k.name}</span><span class="meta">${k.cls}${k.late ? ' · modifica tardiva' : ''}${k.added ? ' · aggiunto alla fermata' : ''}</span></span><span class="chk ${A.checked[k.id] ? 'on' : ''}">${ic('check', 22, 3)}</span></button>`).join('')}</div>` : `<div class="card"><p class="small">Nessun bambino atteso a questa fermata.</p></div>`}
    ${!atSchool ? `<button class="btn btn-dashed btn-block" data-act="apadd">${ic('plus', 16)} ${A.adding ? 'Chiudi' : 'Non è in lista? Aggiungi un bambino iscritto'}</button>` : ''}
    ${A.adding ? `<div class="rows">${addable.length ? addable.map(k => `<button class="row row-btn" data-act="apaddkid" data-a="${k.id}" style="min-height:56px"><span class="av av-s">${initials(k.name)}</span><span class="grow"><span style="font-weight:600">${k.name}</span> <span class="meta">${k.cls} · segnato assente</span></span>${ic('plus', 18)}</button>`).join('') : '<div class="row"><span class="small">Tutti gli iscritti della linea sono già in lista. Un bambino non iscritto non si prende.</span></div>'}</div><p class="small">Solo bambini con iscrizione approvata. Chi non è iscritto non viene preso: il volontario non può assumersi quella responsabilità.</p>` : ''}
    <div class="alert" style="margin-top:auto">${ic('users', 16)}<div class="body"><span><b>${onBoard} a bordo</b> · con ${shiftNames('verde').split(', ').filter(n => n !== 'Marta').join(' e ') || 'nessun altro'}${shiftHasKit('verde') ? ' · kit presente' : ' · nessun kit'}</span></div></div>
  </div>`;
}

/* ---------- amministratore ---------- */
function oggiView(){
  const pending = S.regs.filter(r => r.status === 'pending').length;
  const alerts = [];
  Object.keys(LINES).forEach(l => {
    const st = S.lineStatus[l], n = presentOf(l).length, Ln = L(l);
    if (st === 'cancelled') alerts.push(`<div class="alert a-warn">${ic('warn', 16)}<div class="body"><b>${Ln.name} sotto soglia per domani</b><span>${n} bambini presenti, minimo ${Ln.threshold}. Annullata alle 18:00; si riattiva da sola se entro le 21:00 si arriva a ${Ln.threshold}.</span></div></div>`);
    if (st === 'reactivated') alerts.push(`<div class="alert a-ok">${ic('check', 16)}<div class="body"><b>${Ln.name} riattivata</b><span>${n} bambini presenti: soglia raggiunta con una modifica tardiva.</span></div></div>`);
    if (st === 'cancelled_final') alerts.push(`<div class="alert a-danger">${ic('warn', 16)}<div class="body"><b>${Ln.name} annullata per domani</b><span>Soglia non raggiunta entro le 21:00. Famiglie e volontari avvisati.</span></div></div>`);
    if (st === 'cancelled_vol') alerts.push(`<div class="alert a-danger">${ic('warn', 16)}<div class="body"><b>${Ln.name} annullata: volontari insufficienti</b><span>${shiftCount(l)} su ${Ln.minVol} un'ora prima della partenza. Famiglie avvisate via push e SMS.</span></div></div>`);
    if (S.esc[l] && S.esc[l].step === 'backup') alerts.push(`<div class="alert a-warn">${ic('users', 16)}<div class="body"><b>${Ln.name}: turno scoperto (${shiftCount(l)} su ${Ln.minVol})</b><span>${S.esc[l].missing.join(' e ')} non ${S.esc[l].missing.length > 1 ? 'vengono' : 'viene'}. Backup avvisati alle ${S.esc[l].since.slice(4)}; se nessuno risponde, tocca a te chiamare qualcuno.</span></div></div>`);
    if (S.esc[l] && S.esc[l].step === 'covered') alerts.push(`<div class="alert a-ok">${ic('check', 16)}<div class="body"><b>${Ln.name}: turno coperto</b><span>Anna Ferrari ha preso il posto. ${shiftCount(l)} su ${Ln.minVol}, kit presente.</span></div></div>`);
  });
  if (!alerts.length) alerts.push(`<div class="alert a-ok">${ic('check', 16)}<div class="body"><b>Tutto regolare</b><span>Nessuna linea sotto soglia, nessun turno scoperto.</span></div></div>`);
  return `<div class="stack">
    <div class="head"><div><h1>Amministrazione</h1><p class="sub">Scuola primaria · Vedano al Lambro</p></div><span class="badge b-muted">${ic('shield', 12)} 2FA attiva</span></div>
    ${alerts.join('')}
    <div class="kpi">
      <a href="#iscrizioni" data-act="tab" data-a="iscrizioni" class="card" style="text-decoration:none"><h2>Iscrizioni in attesa</h2><span class="big">${pending}</span><span class="meta">${pending ? 'da approvare' : 'tutto approvato'}</span></a>
      <div class="card"><h2>Bambini domani</h2><span class="big">${presentOf('verde').length + presentOf('blu').length}</span><span class="meta">Verde ${presentOf('verde').length} · Blu ${presentOf('blu').length}</span></div>
    </div>
    <div class="stack-s"><h2>Turni di domani</h2><div class="kpi">${Object.keys(LINES).map(l => `<div class="card"><div class="hstack">${lineDot(l)}<b>${L(l).name}</b></div><span class="big">${shiftCount(l)} <span class="meta" style="font-size:13px;font-weight:500">/ ${L(l).minVol} min</span></span><span class="meta" style="color:${shiftHasKit(l) ? 'var(--ok-fg)' : 'var(--accent-fg)'}">${shiftHasKit(l) ? 'kit presente' : 'nessun kit'} · ${shiftNames(l) || 'nessuno'}</span>${statusBadge(l)}</div>`).join('')}</div></div>
  </div>`;

  return `<div class="between"><div><b style="font-size:16px">Regia della demo</b><div class="hint">Un martedì a Vedano, passo per passo. Ogni passo apre la schermata in cui succede.</div></div><div class="hstack" style="flex-shrink:0"><button class="btn btn-sm btn-outline" data-act="mode" data-a="mappa" title="Tutte le schermate per ruolo e flusso">${ic('grid', 14)} Schermate</button><button class="btn btn-sm btn-outline" data-act="reset" aria-label="Ricomincia">${ic('reset', 14)}</button></div></div>
  <div class="steps">${PHASES.map((p, i) => `<button class="step ${i < S.phase ? 'done' : i === S.phase ? 'cur' : ''}" data-act="step" data-a="${i}" aria-current="${i === S.phase ? 'step' : 'false'}"><span class="n">${i < S.phase ? ic('check', 12, 3) : i + 1}</span><span class="grow"><span class="t mono">${p.t}</span><br><span class="st">${p.title}</span><br><span class="sd">${p.desc}</span><br><span class="where">${ic('chev', 10, 3)} ${whereOf(p)}</span></span></button>`).join('')}</div>
  <button class="btn btn-primary btn-block" data-act="next" ${last ? 'disabled' : ''}>${ic('play', 16)} ${last ? 'Storia finita' : `Avanti: ${nx.t} · ${nx.title}`}</button>
  <div class="hint">Puoi anche agire tu: Giulia cambia una presenza, Marta preme "Non posso venire" o fa l'appello, l'amministratore approva le iscrizioni. Tornando a un passo precedente la demo riparte da capo fino a quel punto.</div>`;
}
function stripView(){
  const p = PHASES[S.phase];
  return `<button class="strip" data-act="sheet" aria-label="Apri la regia della demo">${ic('play', 12)}<span class="grow">Passo ${S.phase + 1} di ${PHASES.length} · <span class="mono">${p.t}</span> · ${p.title}</span><span class="badge b-accent">regia</span></button>`;
}

const GAL = { filter:'all' };
function snapshot(sh){
  const saved = S; QUIET = true;
  S = initState();
  while (S.phase < (sh.phase || 0)){ S.phase++; onEnter(S.phase); }
  const persona = sh.persona || 'genitore';
  Object.assign(S, { loggedIn: sh.login !== false, persona, tab: sh.tab || HOME[persona], sheet:false, toast:null });
  if (sh.make) sh.make();
  const html = frameInner().html;
  S = saved; QUIET = false;
  return html;
}
function roleSection(r){
  const shots = SHOTS.filter(s => s.role === r.id), flows = [...new Set(shots.map(s => s.flow))];
  return `<section class="role" id="role-${r.id}">
    <div class="rolehead"><span class="av av-accent" style="width:48px;height:48px;font-size:16px">${r.av}</span><div class="grow"><h2 class="roletitle">${r.name} <span class="meta" style="font-weight:500">· ${r.who}</span></h2><p class="small">${r.desc}</p></div><span class="badge b-muted">${shots.length} schermate</span></div>
    ${flows.map(f => `<div class="flow"><div class="flowhead"><h3>${f}</h3><p class="small">${FLOWDESC[f] || ''}</p></div>
      <div class="shots">${shots.filter(s => s.flow === f).map(s => `<figure class="shot"><div class="frame mini" aria-hidden="true">${snapshot(s)}</div><figcaption><b>${s.title}</b><span class="small">${s.note}</span></figcaption></figure>`).join('')}</div></div>`).join('')}
  </section>`;
}
function galleryView(){
  const roles = ROLES.filter(r => GAL.filter === 'all' || r.id === GAL.filter);
  return `<div class="gal">
    <header class="galhead"><div><h1 style="font-size:26px">Pedibus Vedano · tutte le schermate</h1><p class="sub">${SHOTS.length} schermate del prototipo, per ruolo e per flusso. Ognuna è uno stato reale della demo: stessa app, stessi dati del martedì.</p></div><button class="btn btn-primary btn-sm" data-act="mode" data-a="demo">${ic('play', 14)} Torna alla demo</button></header>
    <div class="pills galfilter" role="tablist" aria-label="Ruolo">${[['all', 'Tutte'], ...ROLES.map(r => [r.id, r.name])].map(([id, l]) => `<button class="pill ${GAL.filter === id ? 'on' : ''}" data-act="galfilter" data-a="${id}" role="tab" aria-selected="${GAL.filter === id}">${l}</button>`).join('')}</div>
    ${roles.map(roleSection).join('')}
  </div>`;
}

/* ---------- render ---------- */
/* Markup di una schermata (barra ruoli + contenuto + nav) per lo stato corrente S. Usato dalla demo e dalla mappa. */
function frameInner(){
  let body = '', foot = '', key = '';
  if (!S.loggedIn){
    key = S.screen;
    body = S.screen === 'iscrizione' ? iscrizioneView() : S.screen === 'iscrizione_ok' ? iscrizioneOkView() : accessoView();
  } else {
    key = S.persona + ':' + S.tab;
    const aud = audOf[S.persona];
    if (S.tab === 'avvisi') S.seen[aud] = S.inbox[aud].length;
    let inner = '';
    if (S.persona === 'genitore'){
      inner = S.tab === 'presenze' ? presenzeView() : S.tab === 'avvisi' ? inboxView('parent', 'Avvisi') : profiloGenitoreView();
      foot = `<nav class="nav" style="grid-template-columns:repeat(3,minmax(0,1fr))" aria-label="Sezioni">${navItem('presenze', 'Presenze', 'check')}${navItem('avvisi', 'Avvisi', 'bell', unread('parent'))}${navItem('profilo', 'Profilo', 'user')}</nav>`;
    } else if (S.persona === 'volontaria'){
      inner = S.tab === 'turni' ? turniView() : S.tab === 'appello' ? appelloView() : S.tab === 'avvisi' ? inboxView('vol', 'Avvisi') : profiloVolView();
      foot = (S.tab === 'appello' ? appelloFoot() : '') + `<nav class="nav" style="grid-template-columns:repeat(4,minmax(0,1fr))" aria-label="Sezioni">${navItem('turni', 'Turni', 'cal')}${navItem('appello', 'Appello', 'check', S.appello.open && !S.appello.delivered ? '•' : 0)}${navItem('avvisi', 'Avvisi', 'bell', unread('vol'))}${navItem('profilo', 'Profilo', 'user')}</nav>`;
    } else {
      inner = S.tab === 'oggi' ? oggiView() : S.tab === 'iscrizioni' ? iscrizioniView() : S.tab === 'linee' ? lineeView() : S.tab === 'turni' ? turniAdminView() : inboxView('admin', 'Avvisi');
      const pend = S.regs.filter(r => r.status === 'pending').length;
      foot = `<nav class="nav" style="grid-template-columns:repeat(5,minmax(0,1fr))" aria-label="Sezioni">${navItem('oggi', 'Oggi', 'check')}${navItem('iscrizioni', 'Iscrizioni', 'users', pend)}${navItem('linee', 'Linee', 'pin')}${navItem('turni', 'Turni', 'cal')}${navItem('avvisi', 'Avvisi', 'bell', unread('admin'))}</nav>`;
    }
    body = topbar() + `<div class="screen">${inner}</div>`;
  }
  return { key, html: body + foot };
}
function render(){
  const app = document.getElementById('app');
  app.dataset.mode = MODE;
  if (MODE === 'mappa'){ app.dataset.key = 'mappa'; app.innerHTML = galleryView(); return; }
  const prev = app.querySelector('.screen'); const scroll = prev ? prev.scrollTop : 0; const prevKey = app.dataset.key;
  const f = frameInner();
  app.dataset.key = f.key;
  app.innerHTML = `<div class="stage">
    <div class="frame">${stripView()}${f.html}${S.toast ? `<div class="toast" role="status">${S.toast}</div>` : ''}</div>
    <aside class="regia"><div class="rcard">${regiaInner()}</div></aside>
  </div>
  ${S.sheet ? `<div class="sheet"><div class="backdrop" data-act="sheet"></div><div class="panel">${regiaInner()}<button class="btn btn-outline btn-block" data-act="sheet">Chiudi</button></div></div>` : ''}`;
  const cur = app.querySelector('.screen'); if (cur && prevKey === f.key) cur.scrollTop = scroll;
}
render();
